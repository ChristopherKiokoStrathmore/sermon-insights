# Offline demo. Synthetic fixture, no network, no real channel.
channel: "@example-fellowship"
since: "2025-01-01"
languages: [sw, en]
network: false
offline_fixture: fixture
cache_dir: ../../data/sample-run
output: ../example/sermon_insights_sample.xlsx
export_csv: true
whisper:
  model: small
  device: cpu
  compute_type: int8
  language: sw
  cpu_threads: 8
throttle:
  between_videos_s: 0
  request_sleep_s: 0
  subtitle_sleep_s: 0
  ytsearch_sleep_s: 0
  retries: [0]
detect:
  bin_s: 60
  min_words: 25
  gap_bins: 3
  max_music_tags: 0
topics:
  backend: keyword
  min_docs: 8
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
summary:
  backend: lexical
  sentences: 3
