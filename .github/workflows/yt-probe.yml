# Feasibility probe for GitHub-hosted runners. No pipeline, no cookies, no church channel.
# Three sequential jobs so a single push shows whether the results stay the same.

name: yt-probe

on:
  push:
    branches:
      - cursor/run-pipeline-db5e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yt-dlp, the EJS scripts, ffmpeg, and the package
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -e .
          python -m pip install "yt-dlp[default]==2026.8.19"
          echo "yt-dlp $(yt-dlp --version)"
          echo "node $(node --version)"
          python -c "import importlib.metadata as m; print('youtube-transcript-api', m.version('youtube-transcript-api')); print('yt-dlp-ejs', m.version('yt-dlp-ejs'))"

      - name: Probe public YouTube from this runner
        env:
          PROBE_RUN: ${{ matrix.run }}
          PYTHONUNBUFFERED: "1"
        run: python .github/workflows/yt-probe.py
